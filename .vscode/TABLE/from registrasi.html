<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Student Registration Form</title>
  <style>
    body {
      background-color: #7c8391;
      font-family: 'Times New Roman', serif;
      padding: 30px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .row {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }
    .label {
      width: 150px;
      font-size: 18px;
    }
    .field {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    input[type="text"], input[type="password"], select, textarea {
      padding: 3px 6px;
      border: 1px solid #110505;
      border-radius: 2px;
      box-sizing: border-box;
    }
    .full {
      width: 100%;
    }
    textarea {
      width: 100%;
      height: 80px;
    }
    .btn-wrap {
      text-align: center;
      margin-top: 20px;
    }
    button {
      padding: 3px 12px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Student Registration Form</h1>

    <form>
      <div class="row">
        <div class="label">NIS. :</div>
        <div class="field"><input type="text" class="full"></div>
      </div>

      <div class="row">
        <div class="label">Student name :</div>
        <div class="field">
          <input type="text" placeholder="First Name" style="width: 48%;"> - 
          <input type="text" placeholder="Last Name" style="width: 48%;">
        </div>
      </div>

      <!-- <div class="row">
       <div class="label">Father's name :</div>
        <div class="field"><input type="text" class="full"></div>
      </div> -->

      <div class="row">
        <div class="label">Date of birth :</div>
        <div class="field">
          <input type="text" placeholder="Day" style="width: 50px;"> - 
          <input type="text" placeholder="Month" style="width: 60px;"> - 
          <input type="text" placeholder="Year" style="width: 70px;"> 
          <span><i>(DD-MM-YYYY)</i></span>
        </div>
      </div>

      <div class="row">
        <div class="label">No HP. :</div>
        <div class="field">
          <input type="text" value="+62" style="width: 40px;"> - 
          <input type="text" class="full">
        </div>
      </div>

      <div class="row">
        <div class="label">Email id :</div>
        <div class="field"><input type="text" class="full"></div>
      </div>

      <!-- <div class="row"> 
        <div class="label">Password :</div>
        <div class="field"><input type="password" class="full"></div>
      </div> -->

      <div class="row">
        <div class="label">Gender :</div>
        <div class="field">
          <input type="radio" name="g" id="m"> <label for="m">Male</label>
          <input type="radio" name="g" id="f"> <label for="f">Female</label>
        </div>
      </div>

      <div class="row">
        <div class="label">Jurusan :</div>
        <div class="field">
          <input type="checkbox"> TBSM
          <input type="checkbox"> RPL
          <input type="checkbox"> ATPH
          <input type="checkbox"> DKV
          <input type="checkbox"> TKJ
        </div>
      </div>

      <div class="row">
        <div class="label">Course :</div>
        <div class="field">
          <select class="full">
            <option>------------------------- Select Current Course's -------------------------</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="label">Student photo :</div>
        <div class="field"><input type="file"></div>
      </div>

      <div class="row">
        <div class="label">City :</div>
        <div class="field"><input type="text" class="full"></div>
      </div>

      <div class="row">
        <div class="label">Address :</div>
        <div class="field"><textarea></textarea></div>
      </div>

      <div class="btn-wrap">
        <button type="submit">Register</button>
      </div>
    </form>
  </div>

</body>
</html>
